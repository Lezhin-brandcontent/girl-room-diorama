<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Girl's Room Diorama</title>
<style>
  :root { --ink:#3b2f4a; --paper:#fffaf6; --accent:#ff7fa8; --bg1:#f3e9f2; --bg2:#d9d3e6; }
  html,body { margin:0; height:100%; overflow:hidden; font-family:"Pretendard","Apple SD Gothic Neo",system-ui,sans-serif;
              background:radial-gradient(ellipse at 50% 40%, var(--bg1), var(--bg2)); color:var(--ink); }
  canvas { display:block; touch-action:none; position:relative; z-index:1; }
  #night { position:fixed; inset:0; z-index:0; pointer-events:none; opacity:0;
           background:radial-gradient(ellipse at 50% 40%, #4a3f63, #231d33); }
  #hint { z-index:12; position:fixed; left:50%; bottom:22px; transform:translateX(-50%); font-size:13px; letter-spacing:.06em;
          background:rgba(255,255,255,.7); padding:8px 16px; border-radius:99px; pointer-events:none; }
  #tip { z-index:25; position:fixed; pointer-events:none; background:var(--ink); color:#fff; font-size:12px; font-weight:700;
         letter-spacing:.08em; padding:5px 11px; border-radius:99px; transform:translate(14px,14px); opacity:0; transition:opacity .15s; }
  #loading { position:fixed; inset:0; display:grid; place-items:center; background:var(--bg1); z-index:30; font-weight:800; letter-spacing:.2em; }
  #panel { position:fixed; z-index:20; left:20px; top:20px; bottom:20px; width:min(360px,calc(100% - 40px)); box-sizing:border-box;
           background:var(--paper); border-radius:24px; padding:28px; box-shadow:0 20px 60px rgba(80,50,90,.25); transform:translateX(-115%); }
  #panel .tag { color:var(--accent); font-weight:800; font-size:12px; letter-spacing:.14em; }
  #panel h2 { margin:6px 0 10px; font-size:26px; }
  #panel p { line-height:1.65; }
  #panel button { border:0; border-radius:14px; cursor:pointer; font:inherit; }
  #back { background:#f1e6ee; color:var(--ink); padding:7px 14px; font-size:12px!important; font-weight:700; letter-spacing:.1em; margin-bottom:22px; }
  #pImg { display:none; width:100%; border-radius:16px; margin:0 0 16px; box-shadow:0 8px 24px rgba(80,50,90,.18); }
  #pAuthor { font-size:13px; opacity:.6; margin:-4px 0 8px; }
  #pCta { background:var(--accent); color:#fff; padding:13px 20px; font-weight:700; }
  #panel { overflow-y:auto; }
  /* 영상 목록 모드: 반투명 유리 패널, 제목/설명 숨김 */
  #panel.glass { background:rgba(255,248,250,.32); backdrop-filter:blur(18px) saturate(1.15); -webkit-backdrop-filter:blur(18px) saturate(1.15);
                 box-shadow:0 10px 40px rgba(80,50,90,.12); border:1px solid rgba(255,255,255,.45); }
  #panel.vmode #pTag, #panel.vmode #pTitle, #panel.vmode #pBody, #panel.vmode #pAuthor { display:none; }
  #siteBtn { position:fixed; z-index:20; display:none; transform:translate(-50%,0); padding:12px 26px; border-radius:999px;
    background:rgba(255,248,250,.42); backdrop-filter:blur(16px) saturate(1.15); -webkit-backdrop-filter:blur(16px) saturate(1.15);
    border:1px solid rgba(255,255,255,.7); box-shadow:0 8px 24px rgba(120,80,120,.18); color:#2f2335; font-weight:700; font-size:15px;
    letter-spacing:.02em; text-decoration:none; white-space:nowrap; }
  #siteBtn:hover { background:rgba(255,255,255,.7); }
  .phNav { position:fixed; z-index:20; display:none; width:40px; height:40px; margin:-20px 0 0 -20px; border-radius:50%; cursor:pointer;
    border:1px solid rgba(255,255,255,.7); background:rgba(255,248,250,.42); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    color:#2f2335; font-size:22px; line-height:36px; text-align:center; user-select:none; box-shadow:0 8px 24px rgba(120,80,120,.18); }
  .phNav:hover { background:rgba(255,255,255,.7); }
  #panel.glass #back { background:rgba(255,255,255,.55); margin-bottom:16px; }
  .vitem span { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  #vlist { display:none; flex-direction:column; gap:14px; margin-top:6px; }
  .vitem { display:block; width:100%; text-align:left; background:none!important; padding:0!important; border-radius:14px!important; }
  .vitem img { width:100%; aspect-ratio:16/9; object-fit:cover; border-radius:14px; display:block;
               outline:3px solid transparent; outline-offset:2px; transition:outline-color .2s, transform .2s; }
  .vitem:hover img { transform:translateY(-2px); }
  .vitem.on img { outline-color:var(--accent); }
  .vitem span { display:block; margin-top:7px; font-size:13px; font-weight:700; line-height:1.4; color:var(--ink); }
  /* TV 화면 위에 겹치는 유튜브 플레이어 */
  #ytWrap { position:fixed; z-index:15; display:none; overflow:hidden; border-radius:14px; background:#111; }
  #sndBtn { position:fixed; z-index:22; top:18px; right:18px; padding:9px 16px; border-radius:999px; cursor:pointer;
    border:1px solid rgba(255,255,255,.7); background:rgba(255,248,250,.42); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    color:#2f2335; font:700 13px/1 inherit; letter-spacing:.06em; box-shadow:0 8px 24px rgba(120,80,120,.18); }
  #sndBtn:hover { background:rgba(255,255,255,.7); }
  #sndBtn.on { background:rgba(255,127,168,.85); color:#fff; border-color:rgba(255,255,255,.4); }
  #ytWrap iframe { width:100%; height:100%; border:0; display:block; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
<div id="night"></div>
<div id="ytWrap"><iframe id="yt" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="video"></iframe></div>
<div id="loading">LOADING <span id="pct">0</span>%</div>
<div id="tip"></div>
<a id="siteBtn" target="_blank" rel="noopener">사이트 들어가기 →</a>
<div class="phNav" id="phPrev">‹</div><div class="phNav" id="phNext">›</div>
<button id="sndBtn" aria-pressed="false">♪ 소리 꺼짐</button>
<div id="hint">드래그로 돌려보기 · 소품을 눌러보세요</div>
<aside id="panel" class="glass">
  <button id="back">← BACK</button>
  <img id="pImg" alt="">
  <div class="tag" id="pTag"></div>
  <h2 id="pTitle"></h2>
  <div id="pAuthor"></div>
  <p id="pBody"></p>
  <button id="pCta"></button>
  <div id="vlist"></div>
</aside>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

// 클릭 소품: Blender에서 'prop_<id>' 이름의 그룹
const INFO = {
  laptop:    { label:"COMPUTER", view:[0, 0.06, 1], aim:"mon_body", dist:3.6, btnAt:"mon_base", link:"https://www.lezhin.com/ko" },   // 정면으로 다가간 뒤 '사이트 들어가기' 버튼
  tv:        { label:"TV",      view:[0, 0.05, 1], fill:"tv_body", videos:true, tag:"VIDEO", title:"영상", body:"보고 싶은 영상을 골라 보세요." },
  diary:     { label:"NOVEL",   book:true, dist:2.0, btnText:"작품 보러가기 →", link:"https://www.bomtoon.com/bom/novel/main" },   // 책으로 다가가 펼침 → 봄툰 소설 한 편 + 작품 보러가기
  bookshelf: { label:"BOOKS",   zoom:true, view:[0, 0.12, 1], dist:8 },
  corkboard: { label:"GOODS",   zoom:true, view:[0, 0.1, 1], dist:2.7, zoomHint:"굿즈를 눌러 상품을 확인하세요 · 빈 곳을 누르면 돌아가기" },   // 뒷벽 TV 위 보드: 정면으로 다가감 (view 는 buildGoods 에서 보드 방향으로 다시 맞춤)     // 패널 없이 책장으로 다가가기만 (책을 눌러 작품 보기)
  window:    { get label() { return isNight ? "DAY" : "NIGHT"; }, toggle:"night" },   // 창문: 눌러서 낮↔밤 (밤이면 스탠드·미니전구 자동 켜짐)
  frame:     { label:"POSTER",  view:[0, 0.05, 1], dist:6.5, img:"diorama/frame.jpg", tag:"NOTICE",    title:"공지",       body:"액자 — 최신 공지/키비주얼을 거는 자리.",         cta:"공지 보기" },
  rug:       { label:"", toggle:"rug", noLift:true },   // 이스터에그: 이름 안 띄움. 누르면 앞 귀퉁이가 들춰짐
  doll:      { label:"???", view:[0.55, 1, 0.75], fill:"prop_doll", noLift:true, img:"diorama/egg_paper.png", tag:"EASTER EGG", title:"찾았다!",
               body:"러그 밑에 숨어 있던 친구를 찾았어요. 다른 사람한테는 비밀!" },
  phone:     { label:"PHONE",   view:[0, 1, 0.38], aim:"phone_screen", dist:0.62, btnAt:"phone_body", phone:true,
               link:"https://www.lezhin.com/ko", btnText:"이벤트 보러가기 →" },   // 위에서 내려다보며 다가감 → 화면에 레진 이벤트 팝업
  lamp:      { label:"LAMP",    toggle:true },
  radio:     { get label() { return snd.bgmOn ? "MUSIC OFF" : "MUSIC"; }, toggle:"radio" },   // 라디오: 배경음악 켜기/끄기
  fairy:     { label:"LIGHTS",  toggle:"fairy" },   // 벽 미니전구: 눌러서 켜고 끄기   // 패널 없이 불 켜고 끄기
};

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
renderer.toneMappingExposure = 0.95;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

const sun = new THREE.DirectionalLight(0xfff3ea, 1.3);
sun.position.set(4, 8, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left:-4, right:4, top:4, bottom:-4, near:1, far:20 });
sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.02; sun.shadow.radius = 4;
const hemi = new THREE.HemisphereLight(0xffffff, 0xf3d9c8, 0.35);
scene.add(sun, hemi);
const lampLight = new THREE.PointLight(0xffc977, 0, 1.6, 2);
scene.add(lampLight);
// 전구 주변 빛 번짐(halo): 방사형 그라데이션 스프라이트
const haloTex = (() => {
  const c = document.createElement("canvas"); c.width = c.height = 128;
  const g = c.getContext("2d"), r = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  r.addColorStop(0, "rgba(255,236,170,1)"); r.addColorStop(.25, "rgba(255,210,120,.55)"); r.addColorStop(1, "rgba(255,190,100,0)");
  g.fillStyle = r; g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
})();
const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map:haloTex, blending:THREE.AdditiveBlending, depthWrite:false, transparent:true, opacity:0 }));
halo.scale.set(0.2, 0.2, 1);
scene.add(halo);

// 카메라: Blender (9,-9,8.2) → three (9, 8.2, 9). 좁은 화각으로 아이소메트릭 느낌
const camera = new THREE.PerspectiveCamera(18, innerWidth / innerHeight, 0.1, 100);
const HOME = { pos:new THREE.Vector3(14, 12.6, 14), target:new THREE.Vector3(0, 0.9, 0) };
camera.position.copy(HOME.pos);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(HOME.target);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.enablePan = false;
controls.minAzimuthAngle = THREE.MathUtils.degToRad(15);   // 벽 뒷면이 안 보이게 회전 제한
controls.maxAzimuthAngle = THREE.MathUtils.degToRad(75);
controls.minPolarAngle = THREE.MathUtils.degToRad(35);
controls.maxPolarAngle = THREE.MathUtils.degToRad(72);
controls.minDistance = 12; controls.maxDistance = 30;

function fit() {
  // 세로 화면이면 멀리서 보기
  const k = Math.max(1, 1.1 / (innerWidth / innerHeight));
  HOME.pos.setLength(23 * k);
  controls.maxDistance = 30 * k;
}
fit();
camera.position.copy(HOME.pos);

const props = {};                 // id -> { root, meshes, base }
const pickables = [];
new GLTFLoader().load("diorama/girl_room.glb?v=" + Date.now(), (gltf) => {
  const root = gltf.scene;
  root.traverse((o) => {
    if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; o.material.envMapIntensity = 0.4; }  // r160은 scene.environmentIntensity 미지원
    if (o.name.startsWith("prop_")) {
      const id = o.name.slice(5);
      if (!INFO[id]) return;
      const meshes = [];
      o.traverse((m) => { if (m.isMesh) { m.material = m.material.clone(); m.userData.prop = id; meshes.push(m); pickables.push(m); } });
      props[id] = { root:o, meshes, baseY:o.position.y, baseS:o.scale.clone() };
    }
  });
  scene.add(root);
  root.updateMatrixWorld(true);
  applyWallpaper();
  // 모니터 화면은 조명 영향을 받지 않는 재질 → 스탠드 빛 반사가 비치지 않음
  const mon = scene.getObjectByName("mon_screen");
  if (mon) {   // 화면 앞면에 레진 이미지 (조명 영향 없음 = 화면이 스스로 빛나는 느낌)
    const mt = new THREE.TextureLoader().load("diorama/monitor.png");
    mt.colorSpace = THREE.SRGBColorSpace; mt.anisotropy = 8;
    const g = mon.geometry, pos = g.attributes.position, uv = new Float32Array(pos.count * 2), v = new THREE.Vector3();
    g.computeBoundingBox(); const bb = g.boundingBox;
    for (let i = 0; i < pos.count; i++) {
      v.fromBufferAttribute(pos, i);
      uv[i * 2] = (v.x - bb.min.x) / (bb.max.x - bb.min.x);
      uv[i * 2 + 1] = (v.y - bb.min.y) / (bb.max.y - bb.min.y);
    }
    g.setAttribute("uv", new THREE.BufferAttribute(uv, 2));
    mon.material = new THREE.MeshBasicMaterial({ map:mt });
    mon.userData.prop = "laptop";
    const lp = props.laptop; if (lp) lp.meshes = lp.meshes.filter(m => m !== mon);   // 호버 하이라이트(emissive)는 화면 제외
  }
  buildBooks();
  buildGoods();
  setupBook();
  // 스툴 위 책 표지: 봄툰 이미지 (위 표지 윗면에 얇은 판으로 덧붙임)
  const cov = scene.getObjectByName("diary_cover_t");
  if (cov) {
    const ct = new THREE.TextureLoader().load("diorama/bomtoon_cover.png");
    ct.colorSpace = THREE.SRGBColorSpace; ct.anisotropy = 8;
    cov.geometry.computeBoundingBox(); const bb = cov.geometry.boundingBox, sz = bb.getSize(new THREE.Vector3());
    const pl = new THREE.Mesh(new THREE.PlaneGeometry(sz.x * 0.96, sz.z * 0.94),
      new THREE.MeshStandardMaterial({ map:ct, roughness:.5, envMapIntensity:.4 }));
    pl.rotation.x = -Math.PI / 2;
    bb.getCenter(pl.position); pl.position.y = bb.max.y + 0.0006;
    pl.userData.prop = "diary"; pl.name = "diary_cover_img";
    cov.add(pl);
  }
  const lamp = scene.getObjectByName("lamp_bulb");
  if (lamp) {
    new THREE.Box3().setFromObject(lamp).getCenter(halo.position);
    // 실제 광원은 전구보다 벽에서 떨어진 책상 앞쪽·아래에 둬서 벽에 하얀 얼룩이 생기지 않게
    lampLight.position.copy(halo.position).add(new THREE.Vector3(-0.2, -0.2, 0.45));
  }   // 노드 원점이 아니라 실제 전구 위치
  setupNightSky();
  setupPhone(); setupRug(); setupRadio();
  setLamp(false, true);   // 시작은 불 끈 낮 (창문을 눌러 밤으로)
  setupFairy();
  gsap.to("#loading", { opacity:0, duration:.5, onComplete:() => document.getElementById("loading").remove() });
  // 입장 연출: 살짝 돌면서 등장
  camera.position.applyAxisAngle(new THREE.Vector3(0,1,0), -0.5);
  gsap.to({ a:-0.5 }, { a:0, duration:1.8, ease:"power3.out", onUpdate() {
    const p = HOME.pos.clone().applyAxisAngle(new THREE.Vector3(0,1,0), this.targets()[0].a);
    camera.position.copy(p);
  }});
}, (e) => { if (e.total) document.getElementById("pct").textContent = Math.round(e.loaded / e.total * 100); });



// ---------- 벽지: 벽 메시에 평면 투영 UV를 만들어 패턴을 반복 ----------
function applyWallpaper() {
  const tex = new THREE.TextureLoader().load("diorama/wallpaper.jpg");
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = THREE.MirroredRepeatWrapping;   // 원본이 이음매 없는 타일이 아니라 좌우 반전 반복으로 경계를 숨김
  tex.wrapT = THREE.MirroredRepeatWrapping;
  tex.anisotropy = 8;
  const TILE_H = 2.6, TILE_W = TILE_H * (621 / 1344);   // 벽 높이 = 이미지 1장 높이
  const mat = new THREE.MeshStandardMaterial({ map:tex, roughness:.85, envMapIntensity:.4 });
  for (const [name, axis] of [["wall_L", "z"], ["wall_B", "x"]]) {   // 왼쪽 벽은 z축, 뒷벽은 x축 방향으로 펼침
    const m = scene.getObjectByName(name);
    if (!m) continue;
    const g = m.geometry, pos = g.attributes.position, nrm = g.attributes.normal, uv = new Float32Array(pos.count * 2);
    const v = new THREE.Vector3(), n = new THREE.Vector3();
    for (let i = 0; i < pos.count; i++) {
      v.fromBufferAttribute(pos, i).applyMatrix4(m.matrixWorld);
      n.fromBufferAttribute(nrm, i);
      const endFace = Math.abs(axis === "x" ? n.x : n.z) > 0.5;   // 벽 끝 단면은 두께 방향으로 펼쳐 줄무늬 방지
      uv[i * 2] = (endFace ? (axis === "x" ? v.z : v.x) : (axis === "x" ? v.x : -v.z)) / TILE_W;
      uv[i * 2 + 1] = 1 - (2.6 - v.y) / TILE_H;
    }
    g.setAttribute("uv", new THREE.BufferAttribute(uv, 2));
    m.material = mat;
  }
  // 벽 윗면 띠: 벽지 바탕과 같은 흰색
  const capMat = new THREE.MeshStandardMaterial({ color:0xfbf8f6, roughness:.7, envMapIntensity:.4 });
  for (const name of ["wall_L_cap", "wall_B_cap"]) { const c = scene.getObjectByName(name); if (c) c.material = capMat; }
  // 바닥: 벽지와 어울리는 흰색 마루 + 연한 회색 줄눈
  const floorMat = new THREE.MeshStandardMaterial({ color:0xf5f1ed, roughness:.75, envMapIntensity:.4 });
  const seamMat = new THREE.MeshStandardMaterial({ color:0xe2dbd4, roughness:.8, envMapIntensity:.4 });
  // 액자 그림: 안쪽 판 앞면에 frame.jpg
  const fin = scene.getObjectByName("frame_inner");
  if (fin) {
    const ft = new THREE.TextureLoader().load("diorama/frame.jpg");
    ft.colorSpace = THREE.SRGBColorSpace; ft.anisotropy = 8;
    const g = fin.geometry, pos = g.attributes.position, uv = new Float32Array(pos.count * 2), v = new THREE.Vector3();
    g.computeBoundingBox(); const bb = g.boundingBox;
    for (let i = 0; i < pos.count; i++) {
      v.fromBufferAttribute(pos, i);
      uv[i * 2] = (v.x - bb.min.x) / (bb.max.x - bb.min.x);
      uv[i * 2 + 1] = (v.y - bb.min.y) / (bb.max.y - bb.min.y);
    }
    g.setAttribute("uv", new THREE.BufferAttribute(uv, 2));
    fin.material = new THREE.MeshStandardMaterial({ map:ft, roughness:.5, envMapIntensity:.4 });
  }
  // 러그: 투명 배경 PNG (이미지 가로축 = 러그 긴 변(z축 = Blender y))
  const rug = scene.getObjectByName("rug_mat");
  if (rug) {
    // 들출 수 있게 잘게 나눈 판으로 바꿈 (Blender 판은 귀퉁이 4개뿐이라 휘어지지 않음)
    rug.geometry.computeBoundingBox();
    const b0 = rug.geometry.boundingBox, s0 = b0.getSize(new THREE.Vector3()), c0 = b0.getCenter(new THREE.Vector3());
    const pg = new THREE.PlaneGeometry(s0.x, s0.z, 70, 90); pg.rotateX(-Math.PI / 2); pg.translate(c0.x, c0.y, c0.z);
    rug.geometry = pg;

}

// ---------- 코르크보드: 제이미샵 굿즈 (goods/goods.json 에서 무작위 6개) ----------

async function buildGoods() {

  const root = props.corkboard.root;
  root.updateMatrixWorld(true);
  // 보드 앞면 = 그룹 기준 +x 쪽. 보드를 어느 벽에 걸어도 그룹 기준으로 계산하면 똑같이 붙음
  const c = root.worldToLocal(new THREE.Box3().setFromObject(board).getCenter(new THREE.Vector3()));
  const face = c.clone().setX(c.x + 0.012);   // 코르크 판 두께(0.02)의 절반 + 살짝 띄움

  const n = new THREE.Vector3(1, 0, 0).transformDirection(root.matrixWorld);
  const view = [n.x, 0.1, n.z];
  INFO.corkboard.view = view;
  corkTexture(board);
  // 폴라로이드처럼: 흰 종이 + 사진 + 아래 여백에 상품명. 윗부분만 고정돼서 아래로 갈수록 살짝 들뜸
  const PW = 0.14, PH = 0.188;   // 테이프·기울기까지 코르크 판(0.58 x 0.46) 안에 들어오는 크기
  const PINS = [0xff6f9a, 0x8fc3ff, 0xffd166, 0xa7e3a1, 0xc6a8ff, 0xff9f6b];
  const TAPES = ["255,190,210", "190,225,255", "255,230,160", "200,235,190"];
  const shadowTex = softShadowTex();
  list.forEach((g, i) => {
    const row = Math.floor(i / 3), col = i % 3;
    const { tex, ready } = polaroidTex(`diorama/goods/${g.no}.jpg`, g.name);
    const mt = new THREE.MeshStandardMaterial({ map:tex, emissiveMap:tex, emissive:new THREE.Color(.16, .16, .16), roughness:.8, envMapIntensity:.4, side:THREE.DoubleSide });
    const geo = new THREE.PlaneGeometry(PW, PH, 6, 10), pos = geo.attributes.position;

    card.position.set(face.x + 0.003 + i * 0.0004, face.y + (row ? -0.104 : 0.112), face.z + (col - 1) * 0.18);
    card.castShadow = true;
    // 보드에 지는 부드러운 그림자 (실시간 그림자는 너무 얇아 안 보여서 따로 깜)
    const sh = new THREE.Mesh(new THREE.PlaneGeometry(PW * 1.25, PH * 1.2),

    sh.position.set(0.006, -0.008, -0.0025); sh.raycast = () => {};

        tp.position.set(sd * (PW / 2 - 0.014), PH / 2 - 0.01, 0.001); tp.rotation.z = -sd * 0.7;   // 카드 귀퉁이 안쪽에 붙여 판 밖으로 안 삐져나가게

      author: [g.work === "자체브랜드" ? "" : g.work, g.price].filter(Boolean).join(" · "),
      body: "레진·봄툰 공식 굿즈샵 제이미샵에서 판매 중인 상품입니다.",

// 코르크 질감: 크고 작은 알갱이 점 + 같은 그림을 요철(bump)로도 써서 오돌토돌하게
function corkTexture(board) {
  const W = 640, H = 512, c = document.createElement("canvas"); c.width = W; c.height = H;
  const g = c.getContext("2d");
  g.fillStyle = "#cf9f6c"; g.fillRect(0, 0, W, H);
  let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let k = 0; k < 9000; k++) {
    const r = rnd() < .9 ? .6 + rnd() * 1.6 : 2 + rnd() * 2.5, dark = rnd() < .55;
    g.fillStyle = dark ? `rgba(120,72,35,${.25 + rnd() * .45})` : `rgba(240,205,160,${.25 + rnd() * .5})`;
    g.beginPath(); g.ellipse(rnd() * W, rnd() * H, r, r * (.6 + rnd() * .5), rnd() * 3, 0, Math.PI * 2); g.fill();
  }
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  const bump = new THREE.CanvasTexture(c);
  // 원래 UV 는 상자 전개도라 앞면에 그림 일부만 크게 늘어나 붙음 → 앞면 기준으로 UV 를 다시 깖 (가로 z, 세로 y)
  const geo = board.geometry, P = geo.attributes.position, uv = geo.attributes.uv;
  geo.computeBoundingBox(); const bb = geo.boundingBox;
  for (let k = 0; k < P.count; k++)
    uv.setXY(k, (P.getZ(k) - bb.min.z) / (bb.max.z - bb.min.z), (P.getY(k) - bb.min.y) / (bb.max.y - bb.min.y));
  uv.needsUpdate = true;
  board.material = new THREE.MeshStandardMaterial({ map:tex, bumpMap:bump, bumpScale:1.5, roughness:.95, envMapIntensity:.4 });
}
// 폴라로이드 그림: 사진은 가운데를 꽉 채워 자르고(cover), 아래 넓은 여백에 상품명 손글씨 느낌
function polaroidTex(src, name) {
  const W = 480, H = 645, c = document.createElement("canvas"); c.width = W; c.height = H;
  const g = c.getContext("2d");
  g.fillStyle = "#fffdf8"; g.fillRect(0, 0, W, H);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  const img = new Image();
  const ready = new Promise((res) => { img.onload = res; img.onerror = res; });
  img.onload = () => {
    const m = 24, pw = W - m * 2, ph = 520, k = Math.max(pw / img.width, ph / img.height);
    const sw = pw / k, sh = ph / k;
    g.drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, m, m, pw, ph);
    g.strokeStyle = "rgba(0,0,0,.06)"; g.lineWidth = 2; g.strokeRect(m, m, pw, ph);
    g.fillStyle = "#4a3a52"; g.font = '600 30px "Pretendard","Apple SD Gothic Neo",sans-serif'; g.textAlign = "center";
    let t = name; while (g.measureText(t).width > pw - 10 && t.length > 2) t = t.slice(0, -1);
    g.fillText(t === name ? t : t.slice(0, -1) + "…", W / 2, 595);
    tex.needsUpdate = true;
  };
  img.src = src;
  return { tex, ready };
}
function softShadowTex() {
  const c = document.createElement("canvas"); c.width = 128; c.height = 160;
  const g = c.getContext("2d");   // 캔버스 밖에 사각형을 그리고 그 그림자만 안쪽으로 → 흐린 그림자 (사파리에서도 됨)
  g.shadowColor = "rgba(40,20,10,1)"; g.shadowBlur = 14; g.shadowOffsetX = 1000;
  g.fillRect(14 - 1000, 14, 100, 132);
  const t = new THREE.CanvasTexture(c); return t;
}
function tapeTex(rgb) {
  const c = document.createElement("canvas"); c.width = 160; c.height = 52;
  const g = c.getContext("2d");
  g.fillStyle = `rgba(${rgb},.82)`;
  g.beginPath(); g.moveTo(0, 0);   // 양 끝을 손으로 뜯은 듯 지그재그
  for (let y = 0; y <= 52; y += 6.5) g.lineTo((y / 6.5) % 2 ? 5 : 0, y);
  for (let y = 52; y >= 0; y -= 6.5) g.lineTo(160 - ((y / 6.5) % 2 ? 5 : 0), y);
  g.closePath(); g.fill();
  g.fillStyle = "rgba(255,255,255,.35)";
  for (let x = 14; x < 150; x += 22) g.fillRect(x, 0, 8, 52);   // 줄무늬
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
// 압정: 둥근 머리 + 잘록한 목 (카드 앞쪽 = +z)
function pushPin(color) {
  const grp = new THREE.Group();
  const mt = new THREE.MeshPhysicalMaterial({ color, roughness:.25, clearcoat:1, clearcoatRoughness:.15 });
  const head = new THREE.Mesh(new THREE.CylinderGeometry(0.0115, 0.0125, 0.006, 28), mt);
  head.rotation.x = Math.PI / 2; head.position.z = 0.012;
  const cap = new THREE.Mesh(new THREE.SphereGeometry(0.0115, 28, 12, 0, Math.PI * 2, 0, Math.PI / 2), mt);
  cap.rotation.x = Math.PI / 2; cap.scale.y = .35; cap.position.z = 0.015;
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.005, 0.0075, 0.009, 20), mt);
  neck.rotation.x = Math.PI / 2; neck.position.z = 0.0045;
  [head, cap, neck].forEach(m => { m.castShadow = true; grp.add(m); });
  return grp;
}

// ---------- 호버 / 클릭 ----------
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
const tip = document.getElementById("tip");
let hovered = null, focused = null, downAt = null;

function pick(e) {
  mouse.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(scene.children, true)[0];   // 앞에 가린 물체가 있으면 소품 아님
  return hit && hit.object.userData.prop || null;
}
function setHover(id) {
  if (id === hovered) return;
  if (hovered) {
    const p = props[hovered];
    p.meshes.forEach(m => gsap.to(m.material.emissive, { ...(m.userData?.glow || { r:0, g:0, b:0 }), duration:.25 }));
    gsap.to(p.root.position, { y:p.baseY, duration:.28, ease:"power2.out" });
  }
  hovered = id;
  document.body.style.cursor = id ? "pointer" : "";
  tip.style.opacity = id && infoOf(id).label ? 1 : 0;
  if (id) {
    tip.textContent = infoOf(id).label;
    const p = props[id];
    p.meshes.forEach(m => {   // 원래 밝기(glow) 위에 분홍빛을 살짝 더함
      const g0 = m.userData.glow || { r:0, g:0, b:0 };
      gsap.to(m.material.emissive, { r:g0.r + .06, g:g0.g + .04, b:g0.b + .05, duration:.28 });
    });
    // 튕기지 않고 살짝만 뜨게. 책은 작아서 같은 높이도 크게 보이니 더 낮게
    // 예전 0.035 는 너무 붕 떠 보였음 → 들린 게 겨우 느껴질 정도로
    const lift = infoOf(id).noLift ? 0 : id.includes(":") ? 0.006 : 0.015;   // 책·굿즈 카드는 작아서 더 낮게
    gsap.to(p.root.position, { y:p.baseY + lift, duration:.28, ease:"power2.out" });
  }
}
renderer.domElement.addEventListener("pointermove", (e) => {
  tip.style.left = e.clientX + "px"; tip.style.top = e.clientY + "px";
  if (e.pointerType === "mouse") setHover(pick(e));
});
renderer.domElement.addEventListener("pointerdown", (e) => { downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener("pointerup", (e) => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6) return;  // 드래그는 클릭 아님
  const id = pick(e);
  if (id) activate(id);
  else if (focused) closePanel(false);   // 빈 곳 클릭 = 돌아가기
});

function bounce(id) {
  const p = props[id];
  // 예전엔 12% 찌그러뜨린 뒤 고무줄처럼 튕겨서(elastic) 가는 물건(스탠드)이 발작하듯 떨렸음 → 살짝 눌렸다 돌아오기만
  gsap.fromTo(p.root.scale, { x:p.baseS.x * 1.03, y:p.baseS.y * .96, z:p.baseS.z * 1.03 },
    { x:p.baseS.x, y:p.baseS.y, z:p.baseS.z, duration:.35, ease:"power2.out", overwrite:true });
}
// ---------- 방 분위기: 낮/밤 + 스탠드 + 미니전구 ----------
// 낮/밤이 방의 기본 밝기를 정하고, 스탠드·미니전구는 그 위에 빛을 더함
// (예전엔 '스탠드 꺼짐 = 방 어두움'이라 불 끈 낮이 칙칙했음)
const TIME = {
  day:   { sun:1.3, sunC:0xfff3ea, hemi:.35, hemiC:0xffffff, env:.4,  night:0,   sky:0x8ccbf5, lamp:.3, halo:0 },
  night: { sun:.45, sunC:0x9fb0ff, hemi:.2,  hemiC:0xc4ccff, env:.24, night:.34, sky:0x1c2452, lamp:.75, halo:.35 },
};
const BULB_ON = { r:1, g:.82, b:.45 }, BULB_OFF = { r:0, g:0, b:0 };
const WARM = 0xffd2b0;   // 미니전구가 켜지면 방 빛을 이 색 쪽으로 살짝 데움
const rgb = (hex) => { const c = new THREE.Color(hex); return { r:c.r, g:c.g, b:c.b }; };
let isNight = false, lampOn = false, fairyOn = false;
const envK = { v:.4 };
const NIGHT_T = 1.5;   // 낮↔밤 전환 시간(초)
function setLamp(on, instant) { lampOn = on; applyMood(instant); }
function setNight(on) {
  isNight = on;
  lampOn = on;          // 밤이 되면 불이 켜지고, 낮이 되면 꺼짐 (그 뒤엔 각자 눌러서 끄고 켤 수 있음)
  setFairy(on, false, NIGHT_T);
}
function applyMood(instant, dur = .6) {

  // 미니전구: 낮엔 살짝만, 밤엔 방 빛을 따뜻하게 물들임
  const warmK = f ? (isNight ? .45 : .2) : 0;
  const sunC = new THREE.Color(t.sunC).lerp(new THREE.Color(WARM), warmK);
  const hemiC = new THREE.Color(t.hemiC).lerp(new THREE.Color(WARM), warmK);
  gsap.to(sun, { intensity: t.sun * (f && !isNight ? .85 : 1), duration:d });
  gsap.to(sun.color, { r:sunC.r, g:sunC.g, b:sunC.b, duration:d });
  gsap.to(hemi, { intensity: t.hemi * (f && isNight ? 1.25 : 1), duration:d });
  gsap.to(hemi.color, { r:hemiC.r, g:hemiC.g, b:hemiC.b, duration:d });
  gsap.to(lampLight, { intensity: lampOn ? t.lamp : 0, duration:d });
  gsap.to(halo.material, { opacity: lampOn ? t.halo : 0, duration:d });
  gsap.to("#night", { opacity: t.night, duration:d });
  gsap.to(envK, { v: t.env, duration:d, onUpdate:() => scene.traverse(o => {
    if (!o.isMesh) return;
    (Array.isArray(o.material) ? o.material : [o.material]).forEach(mt => { if ("envMapIntensity" in mt) mt.envMapIntensity = envK.v; });
  }) });

const SFX = {
  tap:    (t) => { tone(880, t, .09, .14, "sine", undefined, 520); hiss(t, .02, .05, "highpass", 3000); },
  switch: (t) => { hiss(t, .018, .35, "bandpass", 2600, 2); tone(1400, t, .025, .08, "square");      // 딸깍
                   hiss(t + .07, .02, .22, "bandpass", 1700, 2); },
  chime:  (t) => [784, 988, 1175].forEach((f, i) => tone(f, t + i * .11, 1.1, .07, "sine")),
  twinkle:(t) => [1568, 2093, 1760, 2349, 2637].forEach((f, i) => tone(f, t + i * .06, .35, .04, "triangle")),
  paper:  (t) => { for (let i = 0; i < 6; i++) hiss(t + i * .07 + Math.random() * .03, .09, .12, "bandpass", 2500 + Math.random() * 2500, .8); },
  tune:   (t) => { const g = hiss(t, .45, .12, "bandpass", 1200, .5); tone(600, t, .4, .03, "sine", undefined, 1500); },
};
function sfx(name) {
  if (!name || !snd.on || !actx()) return;
  SFX[name](snd.ctx.currentTime + .005);
}

// 배경음악: 느린 로파이 (78 BPM). Fmaj7 → Em7 → Dm7 → Cmaj7 반복. 16분음표 단위로 0.4초 앞까지 미리 예약
const BPM = 78, STEP = 60 / BPM / 4;
const midi = (n) => 440 * Math.pow(2, (n - 69) / 12);
const CHORDS = [[53, 57, 60, 64], [52, 55, 59, 62], [50, 53, 57, 60], [48, 52, 55, 59]];
const MEL = [72, 74, 76, 79, 81, 84];   // 펜타토닉: 아무거나 골라도 어울림
function bgmStep(i, t) {
  const bus = snd.bgmBus, bar = Math.floor(i / 16) % 4, s = i % 16, ch = CHORDS[bar];
  const swing = (s % 2) ? STEP * .18 : 0, tt = t + swing;
  if (s === 0) ch.forEach((n, k) => { tone(midi(n), t + k * .018, 3.2, .05, "triangle", snd.epBus); tone(midi(n + 12), t + k * .018, 2.2, .018, "sine", snd.epBus); });
  if (s === 10) ch.slice(1).forEach((n) => tone(midi(n), tt, 1.4, .03, "triangle", snd.epBus));
  if (s === 0 || s === 8) tone(midi(ch[0] - 12), t, 1.2, .14, "sine", bus);                                   // 베이스
  if (s === 0 || s === 7 || s === 8) tone(140, tt, .32, s === 7 ? .18 : .32, "sine", bus, 42);              // 킥
  if (s === 4 || s === 12) hiss(t, .16, .06, "bandpass", 1800, .7, bus);                                      // 스네어(가볍게)
  if (s % 2 === 0) hiss(tt, .035, s % 4 ? .018 : .03, "highpass", 7000, 1, bus);                              // 하이햇
  if (s % 4 === 2 && Math.random() < .3) tone(midi(MEL[Math.floor(Math.random() * MEL.length)]), tt, .9, .03, "sine", snd.epBus);
  if (Math.random() < .25) hiss(t + Math.random() * STEP, .006, .04, "highpass", 3000, 1, bus);              // LP 잡음
}
function bgmTick() {
  const c = snd.ctx;
  while (snd.next < c.currentTime + .4) { bgmStep(snd.step++, snd.next); snd.next += STEP; }
}
const BGM_FILE = "";   // 음원 파일을 쓰려면 경로 지정 (예: "diorama/bgm.mp3"). 비워 두면 합성 음악
async function hasFile() { return !!BGM_FILE; }
function bgmLevel() { return snd.bgmOn ? (snd.ducked ? .15 : 1) : 0; }
async function setBgm(on) {
  if (on && !snd.on) setSound(true);   // 라디오를 누른 건 소리를 듣겠다는 뜻 → 소리도 켬
  snd.bgmOn = on;
  radioGlow(on);
  const c = actx(); if (!c) return;
  if (on) sfx("tune");
  if (await hasFile()) {
    if (!snd.audio) { snd.audio = new Audio(BGM_FILE); snd.audio.loop = true; }
    snd.audio.volume = .5 * bgmLevel();
    if (snd.bgmOn) snd.audio.play().catch(() => {}); else snd.audio.pause();
    return;
  }
  const t = c.currentTime;
  snd.bgmBus.gain.cancelScheduledValues(t);
  snd.bgmBus.gain.setTargetAtTime(bgmLevel(), t + (on ? .35 : 0), on ? .6 : .25);
  clearTimeout(snd.stopT);
  if (on && !snd.timer) {
    if (!snd.epBus) {   // 피아노는 고음을 깎아 먹먹하게 (로파이 느낌)
      const lp = c.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1600;
      snd.epBus = lp; lp.connect(snd.bgmBus);
    }
    snd.next = t + .4; snd.step = 0;
    snd.timer = setInterval(bgmTick, 100);
  }
  if (!on && snd.timer) snd.stopT = setTimeout(() => { clearInterval(snd.timer); snd.timer = null; }, 1200);   // 소리가 다 줄어든 뒤 예약 중단
}
function duckBgm(on) {   // TV 영상이 나올 땐 음악을 작게
  snd.ducked = on;
  if (snd.audio) snd.audio.volume = .5 * bgmLevel();
  if (snd.ctx) snd.bgmBus.gain.setTargetAtTime(bgmLevel(), snd.ctx.currentTime, .3);
}
// 라디오: 켜지면 주파수 창이 빛나고 음표가 피어오름
const NOTE_TEX = (() => {
  const c = document.createElement("canvas"); c.width = c.height = 64;
  const g = c.getContext("2d"); g.fillStyle = "#ff7fa8"; g.font = "bold 52px sans-serif"; g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText("♪", 32, 34);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();
let noteTimer = null;
function setupRadio() {
  const dial = scene.getObjectByName("radio_dial");
  if (dial) { dial.material = dial.material.clone(); dial.userData.glow = { r:0, g:0, b:0 }; }
}
function radioGlow(on) {
  const dial = scene.getObjectByName("radio_dial"), root = props.radio && props.radio.root;
  if (dial) { const c = on ? { r:1, g:.7, b:.3 } : { r:0, g:0, b:0 }; dial.userData.glow = c; gsap.to(dial.material.emissive, { ...c, duration:.4 }); }
  clearInterval(noteTimer); noteTimer = null;
  if (!on || !root) return;
  const spk = scene.getObjectByName("radio_spk");
  noteTimer = setInterval(() => {
    if (document.hidden) return;
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:NOTE_TEX, transparent:true, depthWrite:false, opacity:0 }));
    s.raycast = () => {}; s.scale.setScalar(0.07);
    new THREE.Box3().setFromObject(spk || root).getCenter(s.position); s.position.y += 0.1;
    scene.add(s);
    const dx = (Math.random() - .5) * .12;
    gsap.to(s.material, { opacity:.9, duration:.4 });
    gsap.to(s.material, { opacity:0, duration:.6, delay:1.2 });
    gsap.to(s.position, { y:s.position.y + .3, x:s.position.x + dx, duration:1.8, ease:"sine.out",
      onComplete:() => { scene.remove(s); s.material.dispose(); } });
  }, 900);
}

// ---------- 이스터에그: 러그 앞 귀퉁이를 들추면 밑에 숨은 인형 ----------
// 러그는 평소 펼쳐져 있음. 누르면 앞 귀퉁이가 살짝 들춰지고 밑에 캐릭터 종이 조각이 보임
const RUG_HINT = 0, RUG_OPEN = 0.98;   // 평소엔 평평(귀퉁이 0.46 까지는 투명 여백), 누르면 앞 귀퉁이만 살짝
const rugFx = { s:RUG_HINT, open:false };
function setupRug() {
  const rug = scene.getObjectByName("rug_mat"), doll = props.doll && props.doll.root;
  if (!rug || !props.rug) return;
  rugFx.mesh = rug;
  const pos = rug.geometry.attributes.position;
  rug.geometry.computeBoundingBox(); const bb = rug.geometry.boundingBox;
  rugFx.corner = new THREE.Vector2(bb.max.x, bb.max.z);   // 카메라 쪽(+x, +z) 귀퉁이부터 들춤
  rugFx.dir = new THREE.Vector2(bb.min.x - bb.max.x, bb.min.z - bb.max.z).normalize();
  if (doll) {
    // 캐릭터 종이 조각: 바닥에 납작하게 (러그보다 아래라 러그가 덮고 있으면 안 보임)
    const tex = new THREE.TextureLoader().load("diorama/egg_paper.png"); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
    const m = new THREE.Mesh(new THREE.PlaneGeometry(0.36, 0.337),   // 그림 비율 238:223
      new THREE.MeshStandardMaterial({ map:tex, emissiveMap:tex, emissive:new THREE.Color(.15, .15, .15), alphaTest:.5, roughness:.9, envMapIntensity:.4 }));   // 굿즈 사진처럼 살짝 발광 (회색으로 묻히지 않게)
    m.userData.glow = { r:.15, g:.15, b:.15 };
    m.rotation.x = -Math.PI / 2; m.position.y = 0.0055;   // 마루 줄눈(높이 0.004) 위, 러그(0.008) 아래 m.receiveShadow = true;
    m.userData.prop = "doll"; doll.add(m);
    props.doll.meshes.push(m); pickables.push(m);
  }
  rugFx.base = Float32Array.from(pos.array);
  rugPeel(rugFx.s);
}
function rugPeel(s) {
  const geo = rugFx.mesh.geometry, pos = geo.attributes.position, b = rugFx.base, c = rugFx.corner, d0 = rugFx.dir;
  const TH = 1.2, LB = 0.3, R = LB / TH;   // 들리는 각도(약 70°, 넘어가지 않게), 둥글게 휘는 부분 길이
  for (let i = 0; i < pos.count; i++) {
    const x = b[i * 3], y = b[i * 3 + 1], z = b[i * 3 + 2];
    const d = (x - c.x) * d0.x + (z - c.y) * d0.y;   // 귀퉁이에서 안쪽으로 얼마나 들어왔나
    if (d >= s) { pos.setXYZ(i, x, y, z); continue; }
    const u = s - d; let dd, hh;                     // 접히는 선에서 귀퉁이 쪽으로 떨어진 거리
    if (u < LB) { const f = u / R; dd = s - R * Math.sin(f); hh = R * (1 - Math.cos(f)); }
    else { dd = s - R * Math.sin(TH) - (u - LB) * Math.cos(TH); hh = R * (1 - Math.cos(TH)) + (u - LB) * Math.sin(TH); }
    pos.setXYZ(i, x + d0.x * (dd - d), y + hh, z + d0.y * (dd - d));
  }
  pos.needsUpdate = true; geo.computeVertexNormals();
}
function rugToggle() {
  if (!rugFx.base) return;
  rugFx.open = !rugFx.open;
  gsap.to(rugFx, { s: rugFx.open ? RUG_OPEN : RUG_HINT, duration:1.3, ease:"power2.inOut", overwrite:true, onUpdate:() => rugPeel(rugFx.s) });
}
// TV 화면(3D)의 앞면 네 귀퉁이를 화면 좌표로 투영해 플레이어 위치·크기를 매 프레임 맞춤
const _v = new THREE.Vector3();
function placePlayer() {
  if (ytWrap.style.display !== "block") return;
  const scr = scene.getObjectByName("tv_screen"); if (!scr) return;
  const bb = new THREE.Box3().setFromObject(scr);
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const x of [bb.min.x, bb.max.x]) for (const y of [bb.min.y, bb.max.y]) {
    _v.set(x, y, bb.max.z).project(camera);
    const sx = (_v.x + 1) / 2 * innerWidth, sy = (1 - _v.y) / 2 * innerHeight;
    x0 = Math.min(x0, sx); x1 = Math.max(x1, sx); y0 = Math.min(y0, sy); y1 = Math.max(y1, sy);
  }
  const inset = (x1 - x0) * 0.02;
  Object.assign(ytWrap.style, { left:x0 + inset + "px", top:y0 + inset + "px", width:x1 - x0 - inset * 2 + "px", height:y1 - y0 - inset * 2 + "px" });
}

renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); placePlayer(); placeSiteBtn(); placePhoneNav(); });
</script>
